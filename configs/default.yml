server:
  host: "localhost"
  port: 8080
  shutdown_timeout: "30s"
  mode: "development"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  cors:
    allowed_origins: ["*"]

logging:
  file: "logs/kaf-mirror.log"
  level: "INFO"   # DEBUG, INFO, WARN, ERROR
  max_size: 100   # MB
  max_backups: 5
  max_age: 30     # days
  console: false  # Set to true for development, false for production

database:
  path: "data/kaf-mirror.db"
  retention_days: 30

compliance:
  schedule:
    enabled: true
    run_hour: 2
    daily: true
    weekly: false
    monthly: false

replication:
  batch_size: 1000
  compression: "none"
  topic_discovery_interval: "5m"

egress:
  allowed_hosts: []

protection:
  enabled: false
  halt_file: "data/HALT"
  halt_env: "KAF_MIRROR_HALT"
  auto_halt:
    enabled: true
    tombstone_ratio: 0.5
    tombstone_min: 100
    auth_error_burst: 50
