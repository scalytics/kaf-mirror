server:
  host: "0.0.0.0"
  port: 8080
  shutdown_timeout: "30s"
  mode: "development"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  cors:
    allowed_origins: ["*"]

logging:
  file: "logs/kaf-mirror.log"
  level: "INFO"
  console: true

database:
  path: "data/kaf-mirror.db"
  retention_days: 30

compliance:
  schedule:
    enabled: true
    run_hour: 2
    daily: true
    weekly: false
    monthly: false

clusters:
  source:
    provider: "plain"
    brokers: "kafka-source:9092"
    security:
      enabled: false
  target:
    provider: "plain"
    brokers: "kafka-target:9092"
    security:
      enabled: false

replication:
  topic_discovery_interval: "5m"
