image:
  repository: ghcr.io/scalytics/kaf-mirror
  tag: "v1.3.1"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8088

config:
  server:
    host: "0.0.0.0"
    port: 8080
    mode: "production"
    allowInsecure: true
    tls:
      existingSecret: ""
      certKey: "tls.crt"
      keyKey: "tls.key"
    corsAllowedOrigins: ["*"]
  logLevel: "INFO"
  sourceBrokers: "kafka-source:9092"
  targetBrokers: "kafka-target:9092"

secretEnv: []

persistence:
  enabled: true
  storageClass: ""
  size: 2Gi

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}

labels: {}

metrics:
  enabled: true
  path: "/metrics"
  serviceMonitor:
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
affinity: {}
