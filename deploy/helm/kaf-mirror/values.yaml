image:
  repository: ghcr.io/scalytics/kaf-mirror
  tag: "v1.2.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8088
  targetPort: 8080

# Kafka clusters — override per deployment. See configs/docker.yml for schema.
config:
  server:
    host: "0.0.0.0"
    port: 8080
    mode: "production"
  sourceBrokers: "kafscale-broker:9092"
  targetBrokers: "kafscale-broker-standby:9092"

persistence:
  enabled: true
  storageClass: ""
  size: 2Gi

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

# Alpine `adduser -S kaf-mirror` is UID/GID 100.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 100
  fsGroup: 100
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}

labels:
  app.kubernetes.io/part-of: ops-foundation

# /metrics is unauthenticated Go runtime metrics.
metrics:
  enabled: true
  path: "/metrics"
  port: 8088
  serviceMonitor:
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
affinity: {}
