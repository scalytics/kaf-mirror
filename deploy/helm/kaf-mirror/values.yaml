nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/scalytics/kaf-mirror
  tag: "v1.3.1"
  pullPolicy: IfNotPresent

replicaCount: 1

terminationGracePeriodSeconds: 45

service:
  type: ClusterIP
  port: 8088

config:
  server:
    host: "0.0.0.0"
    port: 8080
    mode: "production"
    allowInsecure: true
    shutdownTimeoutSeconds: 30
    tls:
      existingSecret: ""
      certKey: "tls.crt"
      keyKey: "tls.key"
    corsAllowedOrigins: ["http://localhost:8080"]
  logLevel: "INFO"
  sourceBrokers: "kafka-source:9092"
  targetBrokers: "kafka-target:9092"
  sourceSecurity:
    enabled: false
  targetSecurity:
    enabled: false
  ai:
    provider: ""
    endpoint: ""
    model: ""
  monitoring:
    enabled: false
    platform: ""
    prometheus:
      pushGateway: ""
  protection:
    enabled: false
    autoHalt:
      enabled: false
  egress:
    allowedHosts: []

kafkaTLS:
  existingSecret: ""

kerberos:
  keytabSecret: ""
  keytabKey: "kafka.keytab"
  krb5ConfigMap: ""
  krb5ConfKey: "krb5.conf"

secretEnv: []

persistence:
  enabled: true
  storageClass: ""
  size: 2Gi

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}

labels: {}

metrics:
  enabled: true
  path: "/metrics"
  serviceMonitor:
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

nodeSelector: {}
tolerations: []
affinity: {}
