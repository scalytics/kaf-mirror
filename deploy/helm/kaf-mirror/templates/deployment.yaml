apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaf-mirror.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaf-mirror.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1: kaf-mirror keeps its state in SQLite on a ReadWriteOnce volume, which only one pod may open" }}
  {{- end }}
  {{- if lt (int .Values.config.server.shutdownTimeoutSeconds) 1 }}
  {{- fail "config.server.shutdownTimeoutSeconds must be at least 1" }}
  {{- end }}
  {{- if le (int .Values.terminationGracePeriodSeconds) (int .Values.config.server.shutdownTimeoutSeconds) }}
  {{- fail "terminationGracePeriodSeconds must be greater than config.server.shutdownTimeoutSeconds, so Kubernetes does not kill kaf-mirror before its jobs have stopped" }}
  {{- end }}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kaf-mirror.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaf-mirror.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kaf-mirror.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.volumePermissions.image.repository }}:{{ .Values.volumePermissions.image.tag }}"
          imagePullPolicy: {{ .Values.volumePermissions.image.pullPolicy }}
          command:
            - sh
            - -c
            - chown 100:101 /app/data && chmod 0770 /app/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /app/data
      {{- end }}
      containers:
        - name: kaf-mirror
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/configs/default.yml
            - name: KAF_MIRROR_SERVER_HOST
              value: {{ .Values.config.server.host | quote }}
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: {{ if .Values.config.server.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: {{ if .Values.config.server.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.server.tls.existingSecret }}
            - name: tls
              mountPath: /app/tls
              readOnly: true
            {{- end }}
            {{- if .Values.kafkaTLS.existingSecret }}
            - name: kafka-tls
              mountPath: /app/kafka-tls
              readOnly: true
            {{- end }}
            {{- if .Values.kerberos.keytabSecret }}
            - name: kerberos-keytab
              mountPath: /app/kerberos/keytab
              readOnly: true
            {{- end }}
            {{- if .Values.kerberos.krb5ConfigMap }}
            - name: kerberos-krb5
              mountPath: /app/kerberos/krb5
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kaf-mirror.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kaf-mirror.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.server.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.config.server.tls.existingSecret }}
            items:
              - key: {{ .Values.config.server.tls.certKey }}
                path: {{ .Values.config.server.tls.certKey }}
              - key: {{ .Values.config.server.tls.keyKey }}
                path: {{ .Values.config.server.tls.keyKey }}
        {{- end }}
        {{- if .Values.kafkaTLS.existingSecret }}
        - name: kafka-tls
          secret:
            secretName: {{ .Values.kafkaTLS.existingSecret }}
            defaultMode: 288
        {{- end }}
        {{- if .Values.kerberos.keytabSecret }}
        - name: kerberos-keytab
          secret:
            secretName: {{ .Values.kerberos.keytabSecret }}
            defaultMode: 288
            items:
              - key: {{ .Values.kerberos.keytabKey }}
                path: {{ .Values.kerberos.keytabKey }}
        {{- end }}
        {{- if .Values.kerberos.krb5ConfigMap }}
        - name: kerberos-krb5
          configMap:
            name: {{ .Values.kerberos.krb5ConfigMap }}
            items:
              - key: {{ .Values.kerberos.krb5ConfKey }}
                path: {{ .Values.kerberos.krb5ConfKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
