apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaf-mirror.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaf-mirror.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1: kaf-mirror keeps its state in SQLite on a ReadWriteOnce volume, which only one pod may open" }}
  {{- end }}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kaf-mirror.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaf-mirror.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kaf-mirror.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kaf-mirror
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/configs/default.yml
            - name: KAF_MIRROR_SERVER_HOST
              value: {{ .Values.config.server.host | quote }}
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: {{ if .Values.config.server.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: {{ if .Values.config.server.tls.existingSecret }}HTTPS{{ else }}HTTP{{ end }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.server.tls.existingSecret }}
            - name: tls
              mountPath: /app/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kaf-mirror.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kaf-mirror.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.server.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.config.server.tls.existingSecret }}
            items:
              - key: {{ .Values.config.server.tls.certKey }}
                path: {{ .Values.config.server.tls.certKey }}
              - key: {{ .Values.config.server.tls.keyKey }}
                path: {{ .Values.config.server.tls.keyKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
