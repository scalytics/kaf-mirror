apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaf-mirror.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaf-mirror.labels" . | nindent 4 }}
data:
  default.yml: |
    server:
      host: {{ .Values.config.server.host | quote }}
      port: {{ .Values.config.server.port }}
      mode: {{ .Values.config.server.mode | quote }}
      allow_insecure: {{ .Values.config.server.allowInsecure }}
      shutdown_timeout: "{{ int .Values.config.server.shutdownTimeoutSeconds }}s"
      tls:
        {{- if .Values.config.server.tls.existingSecret }}
        enabled: true
        cert_file: "/app/tls/{{ .Values.config.server.tls.certKey }}"
        key_file: "/app/tls/{{ .Values.config.server.tls.keyKey }}"
        {{- else }}
        enabled: false
        {{- end }}
      cors:
        allowed_origins: {{ toJson .Values.config.server.corsAllowedOrigins }}
    logging:
      file: "/app/logs/kaf-mirror.log"
      level: {{ .Values.config.logLevel | quote }}
      console: true
    database:
      path: "/app/data/kaf-mirror.db"
      retention_days: 30
    clusters:
      source:
        provider: "plain"
        brokers: {{ .Values.config.sourceBrokers | quote }}
        security:
          {{- toYaml .Values.config.sourceSecurity | nindent 10 }}
      target:
        provider: "plain"
        brokers: {{ .Values.config.targetBrokers | quote }}
        security:
          {{- toYaml .Values.config.targetSecurity | nindent 10 }}
    replication:
      topic_discovery_interval: "5m"
    ai:
      provider: {{ .Values.config.ai.provider | quote }}
      endpoint: {{ .Values.config.ai.endpoint | quote }}
      model: {{ .Values.config.ai.model | quote }}
      token: ""
      api_secret: ""
    monitoring:
      enabled: {{ .Values.config.monitoring.enabled }}
      platform: {{ .Values.config.monitoring.platform | quote }}
      prometheus:
        push_gateway: {{ .Values.config.monitoring.prometheus.pushGateway | quote }}
      splunk:
        hec_token: ""
    protection:
      enabled: {{ .Values.config.protection.enabled }}
      auto_halt:
        enabled: {{ .Values.config.protection.autoHalt.enabled }}
    egress:
      allowed_hosts: {{ toJson .Values.config.egress.allowedHosts }}
