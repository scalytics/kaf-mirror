name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run smoke suite
        run: make test-smoke

  go-ci:
    name: Go Checks
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run formatting check
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run smoke tests
        run: make test-smoke

      - name: Run race tests
        run: make race

      - name: Upload coverage artifact
        run: go test -coverprofile=coverage.out ./...

      - name: Store coverage file
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        env:
          HELM_VERSION: v3.19.0
          HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
        run: |
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Lint and render the chart
        run: make helm-check
