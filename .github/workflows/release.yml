name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'

      - name: Install cross-compiler for Linux
        run: sudo apt-get update && sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Build release binaries
        run: make release-binaries VERSION=${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kaf-mirror:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kaf-mirror:latest

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/kaf-mirror-linux-amd64
            dist/admin-cli-linux-amd64
            dist/mirror-cli-linux-amd64
            dist/mirror-cli-windows-amd64.exe
            dist/mirror-cli-darwin-amd64
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
