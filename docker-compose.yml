services:
  kafka-source:
    image: redpandadata/redpanda:v23.2.12
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka-source:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:9092"
    networks:
      - kaf-mirror

  kafka-target:
    image: redpandadata/redpanda:v23.2.12
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "1"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka-target:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "29092:9092"
    networks:
      - kaf-mirror

  kaf-mirror:
    build: .
    stop_grace_period: 45s
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/configs/docker.yml
    volumes:
      - ./configs/docker.yml:/app/configs/docker.yml:ro
      - kaf-mirror-data:/app/data
      - kaf-mirror-logs:/app/logs
    depends_on:
      - kafka-source
      - kafka-target
    networks:
      - kaf-mirror

volumes:
  kaf-mirror-data:
  kaf-mirror-logs:

networks:
  kaf-mirror:
    driver: bridge
